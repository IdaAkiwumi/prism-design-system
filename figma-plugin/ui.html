<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PRISM Generator</title>
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111111;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    p {
      font-size: 12px;
      line-height: 1.5;
      color: #555;
      margin: 0 0 12px;
    }

    textarea {
      width: 100%;
      height: 220px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #0066cc;
      color: white;
    }

    .secondary {
      background: #eef2ff;
      color: #111111;
    }
  </style>
</head>
<body>
  <h2>PRISM Figma Generator</h2>
  <p>
    Paste the JSON spec from your PRISM GitHub Pages playground to generate a matching button component in Figma.
  </p>

  <textarea id="specInput">
{
  "componentType": "button",
  "theme": "base",
  "variant": "primary",
  "state": "default",
  "label": "Approve",
  "badgeState": "success",
  "cardTitle": "Absence notification",
  "cardBody": "This card shows how typography, badges, spacing, and buttons work together in one token-driven component.",
  "notes": ""
}
  </textarea>

  <div class="actions">
    <button class="primary" id="generateBtn">Generate Button</button>
    <button class="secondary" id="cancelBtn">Cancel</button>
  </div>

  <script>
    document.getElementById("generateBtn").onclick = () => {
      const specText = document.getElementById("specInput").value;
      parent.postMessage(
        {
          pluginMessage: {
            type: "generate-button",
            specText
          }
        },
        "*"
      );
    };

    document.getElementById("cancelBtn").onclick = () => {
      parent.postMessage(
        {
          pluginMessage: {
            type: "cancel"
          }
        },
        "*"
      );
    };
  </script>
</body>
</html>
